name: Static site checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, pinned for supply-chain integrity
        with:
          persist-credentials: false
      - name: Validate pages, assets and security policy
        run: python3 tests/check_site.py
      - name: Check JavaScript syntax
        run: |
          node --check js/main.js
          node --check js/site-data.js

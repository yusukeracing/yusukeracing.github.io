<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 900px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin: 0;
        }

        h2 {
            margin-top: 0;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0056b3;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>My Website</h1>
    <p>Welcome to my website.</p>
</header>

<main>
    <h2>こんにちは！</h2>

    <p>
        これは適当に作った index.html です。<br>
        HTML・CSS・JavaScriptを1つのファイルにまとめています。
    </p>

    <button onclick="hello()">クリック</button>

    <p id="message"></p>
</main>

<footer>
    &copy; 2026 My Website
</footer>

<script>
    function hello() {
        document.getElementById("message").textContent =
            "ボタンがクリックされました！";
    }
</script>

</body>
</html>
